<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROAMZ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100%;
      height: 100vh;
      background: #f1f0e8;
      color: #111;
      overflow: hidden;
    }

    main {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      font-family: "Syne", sans-serif;
      font-size: clamp(64px, 11vw, 150px);
      font-weight: 800;
      letter-spacing: -0.08em;
      line-height: .8;
    }

    .status {
      margin-top: 38px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .route {
      margin-top: 14px;
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(20px, 2.5vw, 34px);
      font-weight: 500;
    }

    .footer {
      position: absolute;
      bottom: 30px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      letter-spacing: .16em;
      opacity: .5;
    }

    .blink {
      animation: blink 1.1s steps(2, start) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>

<body>
  <main>
    <div class="wrap">

      <div class="logo">ROAMZ</div>

      <div class="status">
        STATUS: <span class="blink">ROAMING</span>
      </div>

      <div class="route">
        THE ROUTE IS STILL LOADING.
      </div>

      <div class="footer">
        NO FIXED DESTINATION.
      </div>

    </div>
  </main>
</body>
</html>
