<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050705" />
  <title>ROAMZ — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #050705;
      color: #f3f5f1;
    }

    body {
      display: grid;
      place-items: center;
      font-family: "Syne", sans-serif;
      overflow: hidden;
    }

    main {
      text-align: center;
      padding: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(72px, 16vw, 180px);
      line-height: .8;
      font-weight: 800;
      letter-spacing: -0.08em;
    }

    .status {
      margin-top: 28px;
      font-family: "IBM Plex Mono", monospace;
      font-size: clamp(10px, 1.4vw, 13px);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #b7ff00;
    }

    .tagline {
      margin-top: 12px;
      font-family: "IBM Plex Mono", monospace;
      font-size: clamp(9px, 1.1vw, 11px);
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #727a70;
    }
  </style>
</head>

<body>
  <main>
    <h1>ROAMZ</h1>
    <div class="status">THE ROUTE IS STILL LOADING.</div>
    <div class="tagline">NO FIXED DESTINATION.</div>
  </main>
</body>
</html>
